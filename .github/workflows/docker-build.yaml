name: buildx

# Builds slim/minimal (base Python wheel), full (native CLI, Python extras, both toolchains),
# rust (Python-free runtime), and rust-full (Python-free with the Rust toolchain), then runs
# native/offline runtime smokes and size gates for all four targets. api aliases full.
#
# Where the bytes go (the self-hosted host uploads slowly, so it uploads no image layers):
#   - `buildx` builds, smoke-tests and size-gates each architecture natively on GitHub-hosted runners
#     (`ubuntu-24.04`, `ubuntu-24.04-arm`; no QEMU) with a registry build cache on GHCR, pushes each
#     image to the GHCR staging repository `ghcr.io/<owner>/<repo>/candidate` and tests it pulled back
#     by digest. The `docker-candidate-<arch>` receipt records those digests.
#   - `executors` (self-hosted, amd64) pulls the tested `full` digest and runs the installed Team
#     executor suite (the one step that compiles Rust); its receipt is `docker-executors-amd64`.
#   - A publish run (`publish=true` with the SDK run and that candidate run) copies exactly the tested
#     digests from GHCR to Docker Hub registry to registry on hosted runners (`promote`), then joins the
#     selected architectures into the multi-architecture tags (`publish`). Nothing is rebuilt.
#     Prereleases only get version-qualified tags; floating tags remain unchanged.
# The repository variable DOCKER_RUNNER=self-hosted moves `buildx` back to the self-hosted Linux
# runners (persistent per-architecture BuildKit caches, arm64 under QEMU); it still stages the
# candidates on GHCR, so it uploads every image from that host.
#
# The size gate ENFORCES by default (5.0.0rc1 requires it, §13): the job fails when `slim`
# exceeds 250 MB or `full` exceeds 2500 MB (uncompressed, `docker image inspect`). `warn` only
# reports (use it to look at a branch that is over budget); `skip` does not measure.

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the images to DockerHub.'
        type: boolean
        default: false
      candidate_run_id:
        description: 'Successful release.yaml run supplying the sealed SDK artifacts.'
        type: string
        default: ''
      image_run_id:
        description: 'Successful Docker candidate run to promote without rebuilding.'
        type: string
        default: ''
      v4_only:
        description: 'Build only the default-target images per dep group (no slim).'
        type: boolean
        default: false
      size_gate:
        description: 'Size gate mode (slim ≤ 250 MB, full ≤ 2500 MB; rust ≤ 250 MB; rust-full ≤ 1600 MB): enforce fails the run, warn only reports.'
        type: choice
        options: [ enforce, warn, skip ]
        default: enforce
  # pull_request:
    # branches: main
  # push:
    # branches: main
    # tags:

permissions:
  contents: read
  actions: read

# Never overlap two release runs: a publication moves shared tags.
concurrency:
  group: mrsm-docker-release
  cancel-in-progress: false

jobs:
  metadata:
    name: Docker release platforms
    runs-on: ubuntu-latest
    outputs:
      docker: ${{ steps.matrix.outputs.docker }}
      platforms: ${{ steps.matrix.outputs.docker_platforms }}
      candidates: ${{ steps.registry.outputs.candidates }}
      cache: ${{ steps.registry.outputs.cache }}
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Verify publication inputs
        env:
          PUBLISH: ${{ inputs.publish }}
          SDK_RUN: ${{ inputs.candidate_run_id }}
          IMAGE_RUN: ${{ inputs.image_run_id }}
          V4_ONLY: ${{ inputs.v4_only }}
          SIZE_GATE: ${{ inputs.size_gate }}
        run: |
          if [ "$PUBLISH" = true ]; then
            [ -n "$SDK_RUN" ] && [ -n "$IMAGE_RUN" ] && [ "$V4_ONLY" != true ] && [ "$SIZE_GATE" = enforce ] || {
              echo 'Publication requires a sealed SDK run, a tested image run and all enforced gates.' >&2; exit 1;
            }
          fi
      - name: Select release platforms
        id: matrix
        run: python scripts/ci/release_matrix.py --github-output "$GITHUB_OUTPUT"
      - name: Name the GHCR staging and cache repositories
        id: registry
        run: |
          repository="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "candidates=$repository/candidate" >> "$GITHUB_OUTPUT"
          echo "cache=$repository/buildcache" >> "$GITHUB_OUTPUT"

  buildx:
    name: buildx (${{ matrix.arch }})
    needs: metadata
    if: ${{ !inputs.publish }}
    runs-on: ${{ vars.DOCKER_RUNNER == 'self-hosted' && fromJSON('["self-hosted","Linux","X64"]') || (matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04') }}
    # Pushes the candidates and the build cache to GHCR; nothing else needs write access.
    permissions:
      contents: read
      actions: read
      packages: write
    timeout-minutes: ${{ vars.DOCKER_RUNNER == 'self-hosted' && 720 || 300 }}
    env:
      PYTHON_BIN: python3
      BUILDX_BUILDER: meerschaum-release-${{ matrix.arch }}
      DOCKER_DEFAULT_PLATFORM: ${{ matrix.platform }}
      GH_TOKEN: ${{ github.token }}
      SDK_RUN: ${{ inputs.candidate_run_id }}
      CANDIDATES: ${{ needs.metadata.outputs.candidates }}
      BUILD_CACHE: ${{ needs.metadata.outputs.cache }}
      SELF_HOSTED: ${{ vars.DOCKER_RUNNER == 'self-hosted' }}
      # The published images run as 1000:1000 whatever account the runner uses.
      MRSM_IMAGE_UID: '1000'
      MRSM_IMAGE_GID: '1000'
    strategy:
      fail-fast: false
      # Self-hosted runners share one Docker daemon; hosted runners build both architectures at once.
      max-parallel: ${{ vars.DOCKER_RUNNER == 'self-hosted' && 1 || 2 }}
      matrix: ${{ fromJSON(needs.metadata.outputs.docker) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          clean: false

      - name: Clean the build context, preserving other CI caches
        run: git clean -ffdx -e /target -e /.venv-ref -e /.venv-test

      - name: Isolate Docker configuration
        run: |
          docker_config="$(mktemp -d "$RUNNER_TEMP/mrsm-docker.XXXXXX")"
          echo "DOCKER_CONFIG=$docker_config" >> "$GITHUB_ENV"
          echo "SDK_ARTIFACT_DIR=$RUNNER_TEMP/mrsm-sdk-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-${{ matrix.arch }}" >> "$GITHUB_ENV"
          echo "IMAGE_RECEIPT_DIR=$RUNNER_TEMP/mrsm-image-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-${{ matrix.arch }}" >> "$GITHUB_ENV"

      # A hosted runner starts with about 20 GB free; `full` with its cache needs about 20 GB more.
      - name: Free disk space on the hosted runner
        if: env.SELF_HOSTED != 'true'
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          docker image prune --all --force >/dev/null
          df -h /

      # setup-python's downloaded interpreters do not support every self-hosted Linux distro.
      # The orchestration scripts use only the standard library; the image builds its own Python.
      - name: Check host Python
        run: python3 -c 'import sys, tomllib; assert sys.version_info >= (3, 11); print(sys.version)'

      - name: Download and verify the complete sealed SDK
        if: inputs.candidate_run_id != ''
        run: python3 scripts/ci/docker_candidate.py sdk --sdk-run-id "$SDK_RUN" --platform "$DOCKER_DEFAULT_PLATFORM" --output "$SDK_ARTIFACT_DIR"

      - name: Set up ARM64 emulation on the self-hosted runner
        if: env.SELF_HOSTED == 'true' && matrix.arch == 'arm64'
        uses: docker/setup-qemu-action@v4
        # The action runs its binfmt image without `--platform`: under the job's default platform
        # (linux/arm64) Docker would pull the arm64 image, which cannot run before QEMU is installed.
        env:
          DOCKER_DEFAULT_PLATFORM: linux/amd64
        with:
          platforms: arm64

      - name: Set Up Docker Buildx (self-hosted, persistent cache)
        if: env.SELF_HOSTED == 'true'
        uses: docker/setup-buildx-action@v4
        with:
          name: meerschaum-release-${{ matrix.arch }}
          use: false
          keep-state: true
          driver-opts: |
            memory=64g
            cpu-period=100000
            cpu-quota=1600000
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 16
              reservedSpace = "10GB"
              maxUsedSpace = "100GB"
              minFreeSpace = "30GB"

      - name: Set Up Docker Buildx (hosted, registry cache)
        if: env.SELF_HOSTED != 'true'
        uses: docker/setup-buildx-action@v4
        with:
          name: meerschaum-release-${{ matrix.arch }}
          use: false

      - name: Log in to the GHCR staging repository
        if: inputs.candidate_run_id != '' && !inputs.v4_only
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # A candidate is pushed to GHCR and tested by digest; other builds load and test local tags.
      - name: Build Docker images
        id: build
        run: |
          args=(--platform "$DOCKER_DEFAULT_PLATFORM")
          if [ -n "$SDK_RUN" ]; then args+=(--sdk-artifacts "$SDK_ARTIFACT_DIR"); fi
          if [ -n "$SDK_RUN" ] && [ "$V4_ONLY" != true ]; then
            args+=(--candidate "$CANDIDATES" --metadata-dir "$IMAGE_RECEIPT_DIR/metadata")
            if [ "$SELF_HOSTED" != true ]; then args+=(--cache-ref "$BUILD_CACHE"); fi
          elif [ "$V4_ONLY" = true ]; then
            args+=(--v4-only)
          fi
          ./scripts/docker/buildx.sh "${args[@]}"
        env:
          V4_ONLY: ${{ inputs.v4_only }}

      - name: Disk use after the build
        if: always() && env.SELF_HOSTED != 'true'
        run: |
          df -h /
          docker system df

      - name: Size gate
        if: ${{ !inputs.v4_only && inputs.size_gate != 'skip' }}
        env:
          # `inputs` is empty on events other than workflow_dispatch: default to enforcing.
          SIZE_GATE_MODE: ${{ inputs.size_gate || 'enforce' }}
          SLIM_IMAGE: ${{ steps.build.outputs.slim_image }}
          FULL_IMAGE: ${{ steps.build.outputs.full_image }}
          RUST_IMAGE: ${{ steps.build.outputs.rust_image }}
          RUST_FULL_IMAGE: ${{ steps.build.outputs.rust_full_image }}
        run: |
          args=(--slim-image "$SLIM_IMAGE" --full-image "$FULL_IMAGE" --slim-max 250 --full-max 2500 --rust-image "$RUST_IMAGE" --rust-full-image "$RUST_FULL_IMAGE" --rust-max 250 --rust-full-max 1600)
          if [ "$SIZE_GATE_MODE" = "warn" ]; then
            args+=(--warn-only)
          fi
          ./scripts/docker/size_gate.sh "${args[@]}"

      # Release skill §5.7: the base wheel must serve its public operations offline, on a read-only
      # filesystem, with installs disabled (scripts/docker/smoke_facade.py exits nonzero otherwise).
      # The slim rootfs ships `python3` (also as `python`) and `bash`.
      - name: Facade smoke (slim)
        if: ${{ !inputs.v4_only }}
        env:
          SLIM_IMAGE: ${{ steps.build.outputs.slim_image }}
        run: |
          [ -n "$SLIM_IMAGE" ] || { echo "No slim image was built." >&2; exit 1; }
          docker run --rm --network none --read-only --tmpfs /scratch \
            -e MRSM_NO_AUTO_INSTALL=1 -e MRSM_ROOT_DIR=/scratch/root -e MRSM_PLUGINS_DIR=/scratch/plugins \
            -v "$PWD/scripts/docker/smoke_facade.py:/smoke_facade.py:ro" \
            --entrypoint python3 "$SLIM_IMAGE" -I -c '
          import importlib.util
          import runpy
          import site
          import sys
          from pathlib import Path
          for directory in ("/scratch/root", "/scratch/plugins"):
              Path(directory).mkdir(parents=True, exist_ok=True)
          sites = [Path(p).resolve() for p in site.getsitepackages(["/usr/local"]) if Path(p).is_dir()]
          assert sites and all(p.is_relative_to("/usr/local") and p.name == "site-packages" for p in sites), sites
          sys.path[:0] = [str(p) for p in sites]
          spec = importlib.util.find_spec("meerschaum")
          assert spec and spec.origin and any(Path(spec.origin).resolve().is_relative_to(p) for p in sites), spec
          runpy.run_path("/smoke_facade.py", run_name="__main__")
          '

      - name: Record the tested candidate digests
        if: ${{ inputs.candidate_run_id != '' && !inputs.v4_only && inputs.size_gate == 'enforce' }}
        run: |
          python3 scripts/ci/docker_candidate.py record --sdk-run-id "$SDK_RUN" --platform "$DOCKER_DEFAULT_PLATFORM" \
            --sdk "$SDK_ARTIFACT_DIR" --metadata-dir "$IMAGE_RECEIPT_DIR/metadata" --repository "$CANDIDATES" \
            --output "$IMAGE_RECEIPT_DIR/docker-candidate.json"

      - uses: actions/upload-artifact@v7
        if: ${{ inputs.candidate_run_id != '' && !inputs.v4_only && inputs.size_gate == 'enforce' }}
        with:
          name: docker-candidate-${{ matrix.arch }}
          path: ${{ env.IMAGE_RECEIPT_DIR }}/docker-candidate.json
          if-no-files-found: error
          retention-days: 90

  # The installed Team executor suite compiles Rust, so it stays on the self-hosted runner with its warm
  # target; it pulls the tested `full` digest from GHCR (downloads are fast there) and uploads nothing
  # but its receipt.
  executors:
    name: installed Team executors (amd64)
    needs: [metadata, buildx]
    if: ${{ !inputs.publish && inputs.candidate_run_id != '' && !inputs.v4_only && inputs.size_gate == 'enforce' && contains(needs.metadata.outputs.platforms, 'linux/amd64') }}
    runs-on: [self-hosted, Linux, X64]
    permissions:
      contents: read
      actions: read
      packages: read
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      SDK_RUN: ${{ inputs.candidate_run_id }}
      DOCKER_DEFAULT_PLATFORM: linux/amd64
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          clean: false

      - name: Clean the checkout, preserving other CI caches
        run: git clean -ffdx -e /target -e /.venv-ref -e /.venv-test

      - name: Isolate Docker configuration
        run: |
          docker_config="$(mktemp -d "$RUNNER_TEMP/mrsm-docker.XXXXXX")"
          echo "DOCKER_CONFIG=$docker_config" >> "$GITHUB_ENV"
          echo "SDK_ARTIFACT_DIR=$RUNNER_TEMP/mrsm-sdk-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-executors" >> "$GITHUB_ENV"
          echo "RECEIPTS=$RUNNER_TEMP/mrsm-receipts-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-executors" >> "$GITHUB_ENV"

      - name: Check host Python
        run: python3 -c 'import sys, tomllib; assert sys.version_info >= (3, 11); print(sys.version)'

      - name: Rust toolchain
        run: scripts/rust/ci.sh setup

      - name: Download and verify the complete sealed SDK
        run: python3 scripts/ci/docker_candidate.py sdk --sdk-run-id "$SDK_RUN" --platform linux/amd64 --output "$SDK_ARTIFACT_DIR"

      - uses: actions/download-artifact@v8
        with:
          name: docker-candidate-amd64
          path: ${{ env.RECEIPTS }}/candidate

      - name: Log in to the GHCR staging repository (read)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Test installed Team executors on the tested image
        run: |
          mkdir -p "$RECEIPTS/executors"
          python3 scripts/ci/docker_candidate.py executors --sdk-run-id "$SDK_RUN" --platform linux/amd64 \
            --sdk "$SDK_ARTIFACT_DIR" --record "$RECEIPTS/candidate/docker-candidate.json" \
            --output "$RECEIPTS/executors/docker-executors.json"

      - uses: actions/upload-artifact@v7
        with:
          name: docker-executors-amd64
          path: ${{ env.RECEIPTS }}/executors/docker-executors.json
          if-no-files-found: error
          retention-days: 90

  # Publication: verify the candidate run's receipts against a freshly verified sealed SDK and the
  # staging registry, then copy exactly those digests to Docker Hub (registry to registry).
  promote:
    name: promote (${{ matrix.arch }})
    needs: metadata
    if: ${{ inputs.publish }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      packages: read
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      SDK_RUN: ${{ inputs.candidate_run_id }}
      IMAGE_RUN: ${{ inputs.image_run_id }}
      DOCKER_DEFAULT_PLATFORM: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.metadata.outputs.docker) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with: { persist-credentials: false }

      - name: Isolate Docker configuration
        run: |
          docker_config="$(mktemp -d "$RUNNER_TEMP/mrsm-docker.XXXXXX")"
          echo "DOCKER_CONFIG=$docker_config" >> "$GITHUB_ENV"
          echo "SDK_ARTIFACT_DIR=$RUNNER_TEMP/mrsm-sdk-${{ matrix.arch }}" >> "$GITHUB_ENV"
          echo "RECEIPTS=$RUNNER_TEMP/mrsm-receipts-${{ matrix.arch }}" >> "$GITHUB_ENV"

      - name: Download and verify the complete sealed SDK
        run: python3 scripts/ci/docker_candidate.py sdk --sdk-run-id "$SDK_RUN" --platform "$DOCKER_DEFAULT_PLATFORM" --output "$SDK_ARTIFACT_DIR"

      - name: Fetch the candidate run's receipts
        run: python3 scripts/ci/docker_candidate.py fetch --sdk-run-id "$SDK_RUN" --image-run-id "$IMAGE_RUN" --platform "$DOCKER_DEFAULT_PLATFORM" --output "$RECEIPTS"

      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          use: false

      - name: Log in to the GHCR staging repository (read)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Check the tested digests are still staged
        run: python3 scripts/ci/docker_candidate.py check --sdk-run-id "$SDK_RUN" --platform "$DOCKER_DEFAULT_PLATFORM" --sdk "$SDK_ARTIFACT_DIR" --receipts "$RECEIPTS"

      - name: Login to DockerHub
        if: inputs.publish
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Publish this architecture's tested images without rebuilding
        if: inputs.publish
        run: python3 scripts/ci/docker_candidate.py promote --sdk-run-id "$SDK_RUN" --platform "$DOCKER_DEFAULT_PLATFORM" --sdk "$SDK_ARTIFACT_DIR" --receipts "$RECEIPTS"

  # Joins the architectures' images into the published tags. Runs only for a publish, and only when
  # every architecture's tested digests were copied.
  publish:
    name: publish (multi-architecture tags)
    needs: [metadata, promote]
    if: ${{ inputs.publish }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHON_BIN: python3
      EXPECTED_PLATFORMS: ${{ needs.metadata.outputs.platforms }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with: { persist-credentials: false }

      - name: Isolate Docker configuration
        run: |
          docker_config="$(mktemp -d "$RUNNER_TEMP/mrsm-docker.XXXXXX")"
          echo "DOCKER_CONFIG=$docker_config" >> "$GITHUB_ENV"

      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          use: false

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Create the multi-architecture tags
        run: ./scripts/docker/buildx.sh --merge ${{ inputs.v4_only && '--v4-only' || '' }}

      - name: Check the published platforms
        env:
          V4_ONLY: ${{ inputs.v4_only }}
        run: |
          version="$(python3 scripts/check_packaging.py --version)"
          groups="minimal full"
          if [ "$V4_ONLY" != true ]; then groups="$groups slim rust rust-full"; fi
          for group in $groups; do
            docker buildx imagetools inspect --raw "bmeares/meerschaum:$version-$group" > manifest.json
            python3 - <<'PY'
          import json, os
          with open('manifest.json') as stream:
              manifest = json.load(stream)
          platforms = {
              p['os'] + '/' + p['architecture']
              for m in manifest['manifests']
              if (p := m.get('platform', {})).get('os') == 'linux'
          }
          expected = set(os.environ['EXPECTED_PLATFORMS'].split(','))
          assert platforms == expected, (platforms, expected)
          print('Verified platforms:', ', '.join(sorted(platforms)))
          PY
          done
