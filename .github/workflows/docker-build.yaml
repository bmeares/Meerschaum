name: buildx

# Builds the Docker images with scripts/docker/buildx.sh (docs/design/v5-build.md):
#   minimal and full (the default target with `meerschaum` and `meerschaum[full]` installed from the
#   maturin wheel; `mrsm` is its console script), and slim (`--target slim`: the base wheel only),
#   then runs the §12.1 size gate (slim ≤ 250 MB, full < 900 MB).
#
# Two architectures, `linux/amd64` and `linux/arm64`, each built NATIVELY on a runner of its own
# architecture (`ubuntu-latest`, `ubuntu-24.04-arm`): the Rust release build (thin LTO, one codegen
# unit) is far too slow under QEMU. Every architecture builds, size-gates and smoke-tests its own
# images; a publish pushes each architecture's `<version>-<tag>-<arch>` image and the `publish` job then
# joins them into the multi-architecture tags (`buildx.sh --merge`: `docker buildx imagetools create`).
# A pre-release only gets version-qualified tags; the `-<arch>` tags stay in the registry.
#
# The size gate ENFORCES by default (5.0.0rc1 requires it, §13): the job fails when `slim`
# exceeds 250 MB or `full` exceeds 900 MB (uncompressed, `docker image inspect`). `warn` only
# reports (use it to look at a branch that is over budget); `skip` does not measure.

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the images to DockerHub.'
        type: boolean
        default: false
      v4_only:
        description: 'Build only the default-target images per dep group (no slim).'
        type: boolean
        default: false
      size_gate:
        description: 'Size gate mode (slim ≤ 250 MB, full < 900 MB): enforce fails the run, warn only reports.'
        type: choice
        options: [ enforce, warn, skip ]
        default: enforce
  # pull_request:
    # branches: main
  # push:
    # branches: main
    # tags:

permissions:
  contents: read

jobs:
  buildx:
    name: buildx (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    # A release build of the wheel on a 4-core hosted runner takes a while; the default is 6 hours.
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-latest, platform: linux/amd64 }
          - { arch: arm64, runner: ubuntu-24.04-arm, platform: linux/arm64 }
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install python3
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Loads this architecture's images into the runner's daemon (no QEMU, no manifest list).
      - name: Build Docker images
        id: build
        run: ./scripts/docker/buildx.sh ${{ inputs.v4_only && '--v4-only' || '' }}

      - name: Size gate
        if: ${{ !inputs.v4_only && inputs.size_gate != 'skip' }}
        env:
          # `inputs` is empty on events other than workflow_dispatch: default to enforcing.
          SIZE_GATE_MODE: ${{ inputs.size_gate || 'enforce' }}
          SLIM_IMAGE: ${{ steps.build.outputs.slim_image }}
          FULL_IMAGE: ${{ steps.build.outputs.full_image }}
        run: |
          args=(--slim-image "$SLIM_IMAGE" --full-image "$FULL_IMAGE" --slim-max 250 --full-max 900)
          if [ "$SIZE_GATE_MODE" = "warn" ]; then
            args+=(--warn-only)
          fi
          ./scripts/docker/size_gate.sh "${args[@]}"

      # Release skill §5.7: the base wheel must serve its public operations offline, on a read-only
      # filesystem, with installs disabled (scripts/docker/smoke_facade.py exits nonzero otherwise).
      # The slim rootfs ships `python3` (also as `python`) and `bash`.
      - name: Facade smoke (slim)
        if: ${{ !inputs.v4_only }}
        env:
          SLIM_IMAGE: ${{ steps.build.outputs.slim_image }}
        run: |
          [ -n "$SLIM_IMAGE" ] || { echo "No slim image was built." >&2; exit 1; }
          docker run --rm --network none --read-only --tmpfs /scratch \
            -e MRSM_NO_AUTO_INSTALL=1 -e MRSM_ROOT_DIR=/scratch/root -e MRSM_PLUGINS_DIR=/scratch/plugins \
            -v "$PWD/scripts/docker/smoke_facade.py:/smoke_facade.py:ro" \
            --entrypoint python3 "$SLIM_IMAGE" -I -c '
          import importlib.util
          import runpy
          import site
          import sys
          from pathlib import Path
          for directory in ("/scratch/root", "/scratch/plugins"):
              Path(directory).mkdir(parents=True, exist_ok=True)
          sites = [Path(p).resolve() for p in site.getsitepackages(["/usr/local"]) if Path(p).is_dir()]
          assert sites and all(p.is_relative_to("/usr/local") and p.name == "site-packages" for p in sites), sites
          sys.path[:0] = [str(p) for p in sites]
          spec = importlib.util.find_spec("meerschaum")
          assert spec and spec.origin and any(Path(spec.origin).resolve().is_relative_to(p) for p in sites), spec
          runpy.run_path("/smoke_facade.py", run_name="__main__")
          '

      - name: Login to DockerHub
        if: inputs.publish
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Reuses the builder's layer cache from the build step above. Only the architecture's own
      # `<version>-<tag>-<arch>` tags are pushed here; the `publish` job joins them.
      - name: Publish this architecture's images
        if: inputs.publish
        run: |
          ./scripts/docker/buildx.sh --push --arch-tags --platform ${{ matrix.platform }} \
            ${{ inputs.v4_only && '--v4-only' || '' }}

  # Joins the architectures' images into the published tags. Runs only for a publish, and only when
  # every architecture built, passed its gates and pushed.
  publish:
    name: publish (multi-architecture tags)
    needs: buildx
    if: ${{ inputs.publish }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install python3
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Create the multi-architecture tags
        run: ./scripts/docker/buildx.sh --merge ${{ inputs.v4_only && '--v4-only' || '' }}

      # Both architectures must be in the version-qualified full image's manifest list.
      - name: Check the manifest list
        run: |
          version="$(python scripts/check_packaging.py --version)"
          docker buildx imagetools inspect "bmeares/meerschaum:$version-full" | tee manifest.txt
          grep -q 'linux/amd64' manifest.txt
          grep -q 'linux/arm64' manifest.txt
