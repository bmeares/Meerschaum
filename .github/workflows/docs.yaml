name: docs

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main, v5]
  pull_request:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs: ${{ steps.changes.outputs.docs }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, ref: '${{ github.sha }}', fetch-depth: 1}
      - name: Check documentation inputs
        id: changes
        env:
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          python - <<'PY'
          import os
          from scripts.ci.changes import changed_files
          event = os.environ['GITHUB_EVENT_NAME']
          needed = event not in ('push', 'pull_request')
          if not needed:
              try:
                  paths = changed_files(os.environ['BASE'] if event == 'pull_request' else os.environ['BEFORE'], os.environ['GITHUB_SHA'])
                  needed = any(p.startswith('docs/') or p in ('scripts/docs.sh', 'scripts/gen_llms_txt.py', 'scripts/generate_mcp_docs.py', '.github/workflows/docs.yaml') for p in paths)
              except Exception:
                  needed = True
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write(f'docs={str(needed).lower()}\n')
          PY

  build:
    needs: changes
    if: ${{ needs.changes.outputs.docs == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, ref: '${{ github.sha }}'}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - name: Install the pinned documentation toolchain
        run: python -m pip install -r docs/requirements.txt
      - name: Build the website with strict link and configuration checks
        working-directory: docs
        run: python -m zensical build --strict
      - uses: actions/upload-artifact@v4
        with:
          name: docs-preview
          path: docs/site
          if-no-files-found: error
          retention-days: 14

  summary:
    name: summary
    if: ${{ always() }}
    needs: [changes, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Documentation checks passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json, os
          needs = json.loads(os.environ['NEEDS'])
          assert needs['changes']['result'] == 'success', needs
          assert needs['build']['result'] in ('success', 'skipped'), needs
          PY
