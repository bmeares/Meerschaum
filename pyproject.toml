# Meerschaum 5: a maturin *mixed* project (docs/design/v5.0.0.md D9, §12).
#
# One wheel per platform: the `meerschaum` Python package (the root `meerschaum/` directory) plus
# the PyO3 extension `meerschaum._core._core` (crates/meerschaum-py) as a `cp311-abi3` module.
# The `mrsm` binary ships in the separate `meerschaum-cli` wheel (crates/meerschaum-cli/pyproject.toml,
# D8), which `meerschaum` depends on. The base wheel depends on nothing else (D20, §12.1); data,
# SQL, GIS, API and Dash libraries are extras.
#
# Version: the single source of truth is `[workspace.package] version` in the root Cargo.toml
# (maturin reads it from crates/meerschaum-py). `scripts/check_packaging.py` keeps the pinned
# `meerschaum-cli` requirement, the extras below and `meerschaum/utils/packages/_packages.py`
# in sync with it. While `meerschaum/config/_version.py` is still on the 4.x parity line, the
# wheel version comes from Cargo and `meerschaum.__version__` is unchanged (see that script).
#
# In-tree development builds do not use this file's build: `scripts/rust/build_py.sh` drops
# `meerschaum/_core/_core.abi3.so` into the working tree (crates/meerschaum-py/pyproject.toml).

[build-system]
requires = ["maturin>=1.9,<2.0"]
build-backend = "maturin"

[project]
name = "meerschaum"
description = "Sync Time-Series Pipes with Meerschaum"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "Bennett Meares", email = "bennett.meares@gmail.com" },
]
maintainers = [
    { name = "Bennett Meares", email = "bennett.meares@gmail.com" },
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Programming Language :: Rust",
    "Programming Language :: SQL",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Database",
    "Natural Language :: English",
]
dynamic = ["version"]

# D8, D20: the only dependency is the binary wheel, pinned to this release (the Cargo workspace
# version in PEP 440 form; enforced by scripts/check_packaging.py).
dependencies = ["meerschaum-cli==5.0.0a1"]

# §12.1. Mirrors `extras` in meerschaum/utils/packages/_packages.py (enforced by
# scripts/check_packaging.py): edit both together.
[project.optional-dependencies]
pandas = ["pandas>=3.0.0", "pyarrow>=20.0.0"]
polars = ["polars>=1.43.2"]
geo = ["shapely>=2.0.7", "pyproj>=3.7.1", "geopandas>=1.0.1", "geoarrow-types>=0.3.0"]
sql = ["SQLAlchemy>=2.0.41", "psycopg[binary]>=3.2.9", "PyMySQL>=0.9.0"]
sql-mssql = ["pyodbc>=4.0.30"]
sql-oracle = ["oracledb>=2.5.0"]
sql-duckdb = ["duckdb>=1.0.0", "duckdb-engine>=0.13.0"]
sql-cockroachdb = ["sqlalchemy-cockroachdb>=2.0.0"]
api = ["fastapi>=0.128.0", "uvicorn>=0.35.0", "a2wsgi>=1.10.0", "python-multipart>=0.0.20", "PyJWT>=2.8.0"]
dash = ["dash>=4.1.0", "a2wsgi>=1.10.0"]
shell = ["ptpython>=3.0.27"]
cli-tools = ["pgcli>=3.1.0", "mycli>=1.23.2", "litecli>=1.5.0", "gadwall>=0.2.0"]
gui = ["pywebview>=3.6.3"]
full = ["meerschaum[pandas,polars,geo,sql,api,dash,shell]"]

[project.urls]
Documentation = "https://docs.meerschaum.io"
Changelog = "https://meerschaum.io/news/changelog"
GitHub = "https://github.com/bmeares/Meerschaum"
Homepage = "https://meerschaum.io"
Donate = "https://github.com/sponsors/bmeares"
Discord = "https://discord.gg/8U8qMUjvcc"

# The `mrsm` command is the binary from `meerschaum-cli`; `meerschaum` stays a Python alias.
[project.scripts]
meerschaum = "meerschaum.__main__:main"

[tool.maturin]
bindings = "pyo3"
strip = true
manifest-path = "crates/meerschaum-py/Cargo.toml"
module-name = "meerschaum._core._core"
python-source = "."
python-packages = ["meerschaum"]
# `extension-module` is a crate feature (not a default) so `cargo test` can link libpython;
# `polars` is the pyo3-polars zero-copy path (same feature set as scripts/rust/build_py.sh).
features = ["pyo3/abi3-py311", "extension-module", "polars"]
exclude = [
    "**/__pycache__/**",
    "**/*.pyc",
    "meerschaum/_core/_core*.so",
    "meerschaum/_core/_core*.pyd",
]
