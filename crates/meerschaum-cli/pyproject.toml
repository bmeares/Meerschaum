# The `meerschaum-cli` binary wheel (docs/design/v5.0.0.md D8): the `mrsm` executable, built with
# maturin `bindings = "bin"` (the uv / ruff pattern). No Python code and no Python dependencies;
# `meerschaum` (the root pyproject.toml) depends on it at the same version.
#
#   maturin build --release -m crates/meerschaum-cli/Cargo.toml
#
# The wheel version comes from the Cargo workspace (`[workspace.package] version`).

[build-system]
requires = ["maturin>=1.9,<2.0"]
build-backend = "maturin"

[project]
name = "meerschaum-cli"
description = "The `mrsm` command line for Meerschaum (native binary)"
readme = "README.md"
requires-python = ">=3.8"
license = "Apache-2.0"
authors = [
    { name = "Bennett Meares", email = "bennett.meares@gmail.com" },
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Programming Language :: Rust",
    "Topic :: Database",
]
dynamic = ["version"]
dependencies = []

[project.urls]
Documentation = "https://docs.meerschaum.io"
GitHub = "https://github.com/bmeares/Meerschaum"
Homepage = "https://meerschaum.io"

[tool.maturin]
bindings = "bin"
strip = true
manifest-path = "Cargo.toml"
