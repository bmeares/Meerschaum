[package]
name = "meerschaum-connector-sql"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Internal crate of Meerschaum: the SQL connector (PostgreSQL, MySQL, SQLite, MSSQL, DuckDB, Oracle) with per-flavor query builders"
readme = "README.md"
homepage.workspace = true
documentation = "https://docs.rs/meerschaum-connector-sql"
keywords = ["meerschaum", "sql", "etl", "postgres", "timeseries"]
categories = ["database", "asynchronous"]
include = ["src/**/*", "/LICENSE", "/NOTICE"]

[package.metadata.docs.rs]
# The default features only (`mssql`): `duckdb` bundles a C++ library docs.rs cannot build in time and `oracle`
# needs a client library. Stated explicitly so a later change of the defaults cannot pull them in.
features = ["mssql"]

[features]
default = ["mssql"]
# The non-`sqlx` drivers (D13). `mssql` (pure Rust, `tiberius` + rustls) is on by default.
# `duckdb` compiles the bundled DuckDB C++ library (several minutes, ~1 GB of objects), and
# `oracle` needs Oracle Instant Client at runtime (as v4's thick mode did), so both are opt-in.
mssql = ["dep:tiberius", "dep:tokio-util"]
oracle = ["dep:oracle"]
duckdb = ["dep:duckdb"]

[dependencies]
sha2 = { workspace = true }
hex = { workspace = true }
meerschaum-core = { workspace = true }
meerschaum-kernel = { workspace = true }
meerschaum-connector = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
indexmap = { workspace = true }
regex = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
rust_decimal = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }
arrow = { workspace = true }
sqlx = { workspace = true }
# Crate-private: stream combinators for the Arrow record-batch stream.
futures-util = { version = "0.3", default-features = false, features = ["std"] }
async-trait = "0.1"
# The same `libsqlite3-sys` sqlx links, for registering the GeoPackage SQL functions.
libsqlite3-sys = { version = "0.30", default-features = false }
tiberius = { version = "0.12", default-features = false, features = ["tds73", "rustls", "chrono", "rust_decimal"], optional = true }
tokio-util = { version = "0.7", features = ["compat"], optional = true }
# 1.4 shares the workspace's Arrow major (56); newer releases pull a second Arrow.
duckdb = { version = "~1.4", features = ["bundled"], optional = true }
oracle = { version = "0.6", features = ["chrono"], optional = true }

[dev-dependencies]
tokio = { workspace = true }
tracing-subscriber = { workspace = true }
