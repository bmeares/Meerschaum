# Meerschaum static configuration (D15).
#
# Port of `meerschaum/_internal/static.py` (`STATIC_CONFIG`). Rust embeds this file with
# `include_str!` (`meerschaum_core::static_config`); the Python façade reads the same file.
# Every key name and the key order match the Python dictionary exactly. The parity test
# `tests/static_config.rs` compares this file with `tests/fixtures/static_config.json`,
# which `tests/fixtures/gen_static.py` dumps from the Python module.
#
# TOML cannot express every Python value, so two markers are used:
#   { __null__ = true }        Python `None`.
#   { __cpu_count_or__ = N }   `(os.cpu_count() or N)`, evaluated when the file is loaded.
# Values marked `# Python: set` or `# Python: tuple` are lists here; sets are listed sorted.

[api]
endpoints.index = "/"
endpoints.favicon = "/favicon.ico"
endpoints.plugins = "/plugins"
endpoints.pipes = "/pipes"
endpoints.metadata = "/metadata"
endpoints.actions = "/actions"
endpoints.jobs = "/jobs"
endpoints.logs = "/logs"
endpoints.users = "/users"
endpoints.tokens = "/tokens"
endpoints.login = "/login"
endpoints.connectors = "/connectors"
endpoints.version = "/version"
endpoints.chaining = "/chaining"
endpoints.websocket = "/ws"
endpoints.dash = "/dash"
endpoints.mcp = "/mcp"
endpoints.webterm = "/webterm/{session_id}"
endpoints.webterm_websocket = "/websocket/{session_id}"
endpoints.info = "/info"
endpoints.healthcheck = "/healthcheck"
endpoints.docs = "/docs"
endpoints.redoc = "/redoc"
endpoints.openapi = "/openapi.json"
oauth.token_expires_minutes = 720
webterm_job_name = "_webterm"
default_timeout = 600

[api.jobs]
stdin_message = "MRSM_STDIN"
stop_message = "MRSM_STOP"
metadata_cache_seconds = 5
temp_prefix = ".api-temp-"

[sql]
internal_schema = "_mrsm_internal"
instance_schema = "mrsm"

[sql.default_create_engine_args]
pool_size = { __cpu_count_or__ = 5 }
max_overflow = { __cpu_count_or__ = 10 }
pool_recycle = 3600
connect_args = {}

[sql.create_engine_flavors]

[sql.create_engine_flavors.timescaledb]
engine = "postgresql+psycopg"
create_engine.pool_size = { __cpu_count_or__ = 5 }
create_engine.max_overflow = { __cpu_count_or__ = 10 }
create_engine.pool_recycle = 3600
create_engine.connect_args = {}
omit_create_engine = ["method"]  # Python: set
to_sql = {}
requirements = ["database", "host", "password", "username"]  # Python: set

[sql.create_engine_flavors.timescaledb.defaults]
port = 5432

[sql.create_engine_flavors.timescaledb-ha]
