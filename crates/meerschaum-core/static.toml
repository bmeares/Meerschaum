[valkey]
colon = "-_"

[environment]
config = "MRSM_CONFIG"
config_dir = "MRSM_CONFIG_DIR"
patch = "MRSM_PATCH"
root = "MRSM_ROOT_DIR"
plugins = "MRSM_PLUGINS_DIR"
venvs = "MRSM_VENVS_DIR"
runtime = "MRSM_RUNTIME"
work_dir = "MRSM_WORK_DIR"
user = "MRSM_USER"
dep_group = "MRSM_DEP_GROUP"
home = "MRSM_HOME"
src = "MRSM_SRC"
uid = "MRSM_UID"
gid = "MRSM_GID"
noask = "MRSM_NOASK"
noninteractive = "MRSM_NONINTERACTIVE"
no_auto_install = "MRSM_NO_AUTO_INSTALL"
# rc15 (Q54): the DataFrame library of a process (and the jobs it starts, systemd units included).
dataframe = "MRSM_DATAFRAME"
id = "MRSM_SERVER_ID"
test_flavors = "MRSM_TEST_FLAVORS"
daemon_id = "MRSM_DAEMON_ID"
compose_project = "MRSM__COMPOSE_PROJECT"
compose_root = "MRSM__COMPOSE_ROOT"
systemd_log_path = "MRSM_SYSTEMD_LOG_PATH"
systemd_stdin_path = "MRSM_SYSTEMD_STDIN_PATH"
systemd_result_path = "MRSM_SYSTEMD_RESULT_PATH"
systemd_delete_job = "MRSM_SYSTEMD_DELETE_JOB"
uri_regex = "MRSM_([a-zA-Z0-9]*)_(\\d*[a-zA-Z][a-zA-Z0-9-_+]*$)"
prefix = "MRSM_"

[config]
default_filetype = "json"
symlinks_key = "_symlinks"
max_backups_per_key = 10

[system]

[system.arguments]
sub_decorators = ["[", "]"]  # Python: tuple
underscore_standin = "<UNDERSCORE>"
failure_key = "_argparse_exception"
and_key = "+"
escaped_and_key = "++"
pipeline_key = ":"
escaped_pipeline_key = "::"

[system.urls]
"get-pip.py" = "https://bootstrap.pypa.io/get-pip.py"

[system.success]
# PARITY: `static.py` is missing a comma between 'success' and 'Succeeded', so Python
# concatenates them into one string. Kept as-is.
ignore = ["Success", "successSucceeded", "", { __null__ = true }]  # Python: tuple

[system.prompt]
web = false

[system.fetch_pipes_keys]
negation_prefix = "_"

[connectors]
default_label = "main"

[dtypes]

[dtypes.datetime]
default_precision_unit = "microsecond"

[stack]
dollar_standin = "<DOLLAR>"

[users]
password_hash.algorithm_name = "sha256"
password_hash.salt_bytes = 16
password_hash.schemes = ["pbkdf2_sha256"]
password_hash.default = "pbkdf2_sha256"
password_hash.pbkdf2_sha256__default_rounds = 1000000
min_username_length = 1
max_username_length = 60
min_password_length = 5

[plugins]
repo_separator = "@"
lock_sleep_total = 1.0
lock_sleep_increment = 0.1
origins_filename = ".mrsm_origins.json"

[pipes]
dtypes.min_ratio_columns_changed_for_full_astype = 0.5
max_bound_time_days = 36525

[jobs]
check_restart_seconds = 1.0
stop_token = "<------- MRSM_STOP_TOKEN ------->"
clear_token = "<------- MRSM_CLEAR_TOKEN ------->"
flush_token = "<------- MRSM_FLUSH_TOKEN ------->\n"

[tokens]
minimum_length = 24
maximum_length = 32
hash_rounds = 100000

[tokens.scopes]
