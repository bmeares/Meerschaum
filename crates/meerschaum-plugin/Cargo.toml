[package]
name = "meerschaum-plugin"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "The native plugin SDK for Meerschaum: a versioned C ABI, a safe Plugin trait and connector adapters"
readme = "README.md"
homepage.workspace = true
documentation = "https://docs.rs/meerschaum-plugin"
keywords = ["meerschaum", "plugin", "sdk", "ffi", "etl"]
categories = ["api-bindings", "external-ffi-bindings"]
include = ["src/**/*", "examples/**/*", "schema/**/*", "wit/**/*", "/LICENSE", "/NOTICE"]

[dependencies]
meerschaum-core = { workspace = true }
meerschaum-kernel = { workspace = true }
meerschaum-connector = { workspace = true }
arrow = { workspace = true, features = ["ffi"] }
serde = { workspace = true }
serde_json = { workspace = true }
indexmap = { workspace = true }
libloading = "0.9"
sha2 = { workspace = true }
hex = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }
jsonschema = { version = "0.59", default-features = false }

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true }

[[example]]
name = "native_demo"
crate-type = ["cdylib"]

[[example]]
name = "bad_abi"
crate-type = ["cdylib"]

[[example]]
name = "native_probe"
crate-type = ["cdylib"]
