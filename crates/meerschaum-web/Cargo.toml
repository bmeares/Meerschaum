[package]
name = "meerschaum-web"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Internal crate of Meerschaum: the web terminal (vendored xterm.js), the job-log stream and native plugin pages of the web console"
readme = "README.md"
homepage.workspace = true
documentation = "https://docs.rs/meerschaum-web"
keywords = ["meerschaum", "dashboard", "terminal", "xterm", "etl"]
categories = ["web-programming", "visualization"]
include = ["src/**/*", "assets/**/*", "build.rs", "/LICENSE", "/NOTICE"]

[dependencies]
meerschaum-server = { workspace = true }
meerschaum-connector-valkey = { workspace = true }
meerschaum-connector = { workspace = true }
meerschaum-core = { workspace = true }
meerschaum-kernel = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
tokio = { workspace = true }
axum = "0.8"
async-trait = "0.1"
percent-encoding = "2"
futures-util = "0.3"
# The vendored console assets are embedded gzip-compressed (`build.rs`) and inflated for the
# rare client that does not accept gzip.
flate2 = "1"

[build-dependencies]
flate2 = "1"
sha2 = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tempfile = "3"
indexmap = { workspace = true }
# The server's shared test helpers (`meerschaum-server/tests/common`) use its models.
meerschaum-connector-api = { workspace = true }
bytes = "1"
meerschaum-connector-sql = { workspace = true }
tower = { version = "0.5", features = ["util"] }
