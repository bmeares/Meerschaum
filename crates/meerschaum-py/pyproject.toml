# maturin build definition for the `meerschaum._core` extension (v5).
#
# A maturin *mixed* project whose Python source is the repository root (`python-source = "../.."`),
# so `maturin develop --skip-install` drops `_native.abi3.so` straight into `meerschaum/_core/`.
# This file is the IN-TREE DEVELOPMENT build only (`scripts/rust/build_py.sh`). The release
# distribution is built from the root `pyproject.toml` (maturin mixed project, D9; the one wheel,
# whose `mrsm` console script runs the CLI from this extension, D8); see
# `.github/workflows/wheels.yaml`. Keep `features` and `module-name` here in step with the root.
#
# `maturin build` from here produces an extension-only wheel (`meerschaum/_core/_native.abi3.so`):
# maturin does not package Python sources that sit outside this project root. The distribution
# is deliberately NOT named `meerschaum`, so installing it can never replace an installed
# `meerschaum` package.

[build-system]
requires = ["maturin>=1.9,<2.0"]
build-backend = "maturin"

[project]
name = "meerschaum-core-dev"
dynamic = ["version"]
requires-python = ">=3.11"
description = "Development build of the meerschaum._core extension (do not upload)."
classifiers = ["Private :: Do Not Upload"]
# D20: the 5.0 base wheel has no runtime dependencies.
dependencies = []

[tool.maturin]
bindings = "pyo3"
# `extension-module` is a crate feature (not a default) so `cargo test` can link libpython.
# NOTE: `maturin ... --features X` replaces this list; build_py.sh passes the full set plus
# `polars` (the opt-in pyo3-polars path).
features = ["pyo3/abi3-py311", "extension-module", "oracle"]
module-name = "meerschaum._core._native"
python-source = "../.."
python-packages = ["meerschaum"]
exclude = [
    "**/__pycache__/**",
    "**/*.pyc",
]
